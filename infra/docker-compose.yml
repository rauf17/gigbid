services:
  postgres:
    image: postgres:17
    container_name: gigbid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gigbid
      POSTGRES_USER: gigbid
      POSTGRES_PASSWORD: gigbid
    ports:
      - "5433:5432"
    volumes:
      - gigbid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigbid -d gigbid"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gigbid_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: gigbid_ollama
    profiles:
      - local-llm
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - gigbid_ollama:/root/.ollama

  gigsim:
    build:
      context: ..
      dockerfile: infra/docker/gigsim.Dockerfile
    container_name: gigbid_gigsim
    restart: unless-stopped
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  marketplace-mcp:
    build:
      context: ..
      dockerfile: infra/docker/marketplace-mcp.Dockerfile
    container_name: gigbid_marketplace_mcp
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      GIGSIM_BASE_URL: http://gigsim:8081
    depends_on:
      gigsim:
        condition: service_healthy

  portfolio-mcp:
    build:
      context: ..
      dockerfile: infra/docker/portfolio-mcp.Dockerfile
    container_name: gigbid_portfolio_mcp
    restart: unless-stopped
    ports:
      - "8001:8001"

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: gigbid_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://gigbid:gigbid@postgres:5432/gigbid
      REDIS_URL: redis://redis:6379/0
      GIGSIM_BASE_URL: http://gigsim:8081
      MARKETPLACE_MCP_URL: http://marketplace-mcp:8002/mcp
      PORTFOLIO_MCP_URL: http://portfolio-mcp:8001/mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gigsim:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    container_name: gigbid_worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://gigbid:gigbid@postgres:5432/gigbid
      REDIS_URL: redis://redis:6379/0
      GIGSIM_BASE_URL: http://gigsim:8081
      MARKETPLACE_MCP_URL: http://marketplace-mcp:8002/mcp
      PORTFOLIO_MCP_URL: http://portfolio-mcp:8001/mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    container_name: gigbid_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  gigbid_pgdata:
  gigbid_ollama:
