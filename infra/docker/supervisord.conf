[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:gigsim]
command=uvicorn gigsim.app:app --host 127.0.0.1 --port 8081
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/gigsim.log
stderr_logfile=/var/log/supervisor/gigsim.err.log

[program:portfolio-mcp]
command=uvicorn mcp_servers.portfolio.server:app --host 127.0.0.1 --port 8001
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/portfolio-mcp.log
stderr_logfile=/var/log/supervisor/portfolio-mcp.err.log

[program:marketplace-mcp]
command=uvicorn mcp_servers.marketplace.server:app --host 127.0.0.1 --port 8002
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/marketplace-mcp.log
stderr_logfile=/var/log/supervisor/marketplace-mcp.err.log

[program:api]
command=uvicorn apps.api.main:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err.log

[program:worker]
command=arq worker.main.WorkerSettings
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/worker.log
stderr_logfile=/var/log/supervisor/worker.err.log

[program:web]
command=npx next start -p 7860 -H 0.0.0.0
directory=/app/apps/web
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/web.log
stderr_logfile=/var/log/supervisor/web.err.log
