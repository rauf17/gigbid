# Models are chosen per node HERE, never in code. Tune by measurement (R&D questions A/B/C).
marketplace:
  mode: gigsim            # gigsim | upwork
  max_requests_per_minute: 20
  live_poll_interval_minutes: 180

fit_matcher:
  similarity_threshold: 0.35
  require_skill_overlap: true
  min_skill_overlap: 1

profiles:
  open:                   # REQUIRED: open-weight only (Groq provider)
    provider: groq
    request_timeout: 30.0
    max_retries: 3
    fallback_model: openai/gpt-oss-20b
    rate_limits:
      requests_per_minute: 30   # TODO: adjust per Groq tier limits from console
      tokens_per_minute: 20000  # TODO: adjust per Groq tier limits from console
    pricing:
      # Cost in USD per 1M tokens (free tier = 0.0)
      openai/gpt-oss-20b:
        prompt_usd_per_m: 0.0
        completion_usd_per_m: 0.0
      openai/gpt-oss-120b:
        prompt_usd_per_m: 0.0
        completion_usd_per_m: 0.0
      qwen/qwen3.8-27b:
        prompt_usd_per_m: 0.0
        completion_usd_per_m: 0.0
    nodes:
      scout:
        model: openai/gpt-oss-20b
        temperature: 0.1
        max_output_tokens: 1024
        reasoning_effort: low
      analyst:
        model: openai/gpt-oss-20b
        temperature: 0.1
        max_output_tokens: 2048
        reasoning_effort: low
      risk_assessor:
        model: openai/gpt-oss-20b
        temperature: 0.0
        max_output_tokens: 1024
        reasoning_effort: low
      fit_matcher:
        model: openai/gpt-oss-20b
        temperature: 0.1
        max_output_tokens: 1024
        reasoning_effort: low
      pricing:
        model: openai/gpt-oss-20b
        temperature: 0.0
        max_output_tokens: 1024
        reasoning_effort: low
      compliance:
        model: openai/gpt-oss-20b
        temperature: 0.0
        max_output_tokens: 1024
        reasoning_effort: low
      requirement_decomposer:
        model: openai/gpt-oss-20b
        temperature: 0.1
        max_output_tokens: 2048
        reasoning_effort: low
      verifier:
        model: openai/gpt-oss-120b
        temperature: 0.0
        max_output_tokens: 2048
        reasoning_effort: medium
      writer:
        model: openai/gpt-oss-120b
        temperature: 0.5
        max_output_tokens: 4096
        reasoning_effort: medium
      critic:
        model: openai/gpt-oss-120b
        temperature: 0.2
        max_output_tokens: 2048
        reasoning_effort: medium
      client_liaison:
        model: openai/gpt-oss-120b
        temperature: 0.4
        max_output_tokens: 2048
        reasoning_effort: medium
      extract_style_rule:
        model: openai/gpt-oss-20b
        temperature: 0.1
        max_output_tokens: 1024
        reasoning_effort: low
    embeddings: nomic-embed-text      # open model, CPU-friendly
    reranker: bge-reranker-v2-m3

  open_alt:               # Alternative open-weight profile for model comparison
    provider: groq
    request_timeout: 30.0
    max_retries: 3
    fallback_model: openai/gpt-oss-20b
    rate_limits:
      requests_per_minute: 30   # TODO: adjust per Groq tier limits from console
      tokens_per_minute: 20000  # TODO: adjust per Groq tier limits from console
    pricing:
      openai/gpt-oss-20b:
        prompt_usd_per_m: 0.0
        completion_usd_per_m: 0.0
      openai/gpt-oss-120b:
        prompt_usd_per_m: 0.0
        completion_usd_per_m: 0.0
      qwen/qwen3.8-27b:
        prompt_usd_per_m: 0.0
        completion_usd_per_m: 0.0
    nodes:
      scout:
        model: openai/gpt-oss-20b
        temperature: 0.1
        max_output_tokens: 1024
        reasoning_effort: low
      analyst:
        model: openai/gpt-oss-20b
        temperature: 0.1
        max_output_tokens: 2048
        reasoning_effort: low
      risk_assessor:
        model: openai/gpt-oss-20b
        temperature: 0.0
        max_output_tokens: 1024
        reasoning_effort: low
      fit_matcher:
        model: openai/gpt-oss-20b
        temperature: 0.1
        max_output_tokens: 1024
        reasoning_effort: low
      pricing:
        model: openai/gpt-oss-20b
        temperature: 0.0
        max_output_tokens: 1024
        reasoning_effort: low
      compliance:
        model: openai/gpt-oss-20b
        temperature: 0.0
        max_output_tokens: 1024
        reasoning_effort: low
      requirement_decomposer:
        model: openai/gpt-oss-20b
        temperature: 0.1
        max_output_tokens: 2048
        reasoning_effort: low
      verifier:
        model: qwen/qwen3.8-27b
        temperature: 0.0
        max_output_tokens: 2048
        reasoning_effort: medium
      writer:
        model: qwen/qwen3.8-27b
        temperature: 0.5
        max_output_tokens: 4096
        reasoning_effort: medium
      critic:
        model: qwen/qwen3.8-27b
        temperature: 0.2
        max_output_tokens: 2048
        reasoning_effort: medium
      client_liaison:
        model: qwen/qwen3.8-27b
        temperature: 0.4
        max_output_tokens: 2048
        reasoning_effort: medium
      extract_style_rule:
        model: openai/gpt-oss-20b
        temperature: 0.1
        max_output_tokens: 1024
        reasoning_effort: low
    embeddings: nomic-embed-text
    reranker: bge-reranker-v2-m3

  paid:                   # OPTIONAL placeholder
    provider: openai
    nodes: {}

active_profile: open

rag:
  variant: v0_naive       # changed ONLY after measurement (R6)
  pipeline: [dense]
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  outcome_alpha: 0.2
  rrf_k: 60
  rerank_top_k: 30
  presets:
    v0_naive: [dense]
    v1_decompose: [decompose, dense, merge]
    v2_hybrid: [hybrid]
    v3_rerank: [hybrid, rerank]
    v4_outcome: [hybrid, rerank, outcome_boost]

budgets:
  max_graph_steps: 30
  max_revisions: 2
  max_tokens_per_job: 12000
  declared_p95_latency_s: {job_analysed: 12.0, proposal: 25.0}
  declared_cost_usd: {job_analysed: 0.01, proposal: 0.03}

autonomy:
  auto_skip_low_fit: true
  auto_send: false         # STRICT ENFORCEMENT: Never auto-send proposals

thresholds:
  minimum_fit_score: 0.60
  maximum_risk_score: 0.70
  worth_connects_min_ev_ratio: 2.0
  connects_cost_usd: 0.15

pricing:
  connects_value_usd: 0.15
  min_ev_ratio: 2.0
  target_margin: 0.15
  hourly_band_spread: 0.15
  fixed_band_spread: 0.10

policy:                   # rules in config, not code (change-request readiness)
  version: 1
  path: data/policy_pack/policy.yaml

memory:
  min_observations: 2
  min_outcomes: 3
  laplace_smoothing: true
