name: Smoke Eval Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate evaluation dataset
        run: make data

      - name: Run CI smoke eval and check gates
        run: make eval-smoke
