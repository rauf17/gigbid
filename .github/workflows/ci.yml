name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run python scripts/check_repo_rules.py
      - run: make data
      - run: uv run pytest -q
  # TODO Phase 5: playwright job (apps/web) + integration job against GigSim
